<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#1e1e2f,#141414);color:#f5f5f5;}
    .glass-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);border-radius:1rem;}
  </style>
</head>
<body class="d-flex align-items-center">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="glass-card p-4">
          <h1 class="h5 mb-3">Edit User</h1>
          <form method="post">
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input id="email" type="email" name="new_email" class="form-control" value="{{ email }}" />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label small">New Password</label>
              <input id="password" type="password" name="password" class="form-control" placeholder="Leave blank to keep current" />
            </div>
            <div class="mb-3">
              <label for="telegram" class="form-label small">Telegram ID</label>
              <input id="telegram" type="text" name="telegram" class="form-control" value="{{ telegram }}" />
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin" class="btn btn-secondary ms-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
