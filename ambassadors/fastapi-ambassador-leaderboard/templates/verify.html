<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='custom.css') }}" rel="stylesheet">
    <style>
        body { min-height:100vh; background:linear-gradient(135deg,#1e1e2f,#141414); color:#f5f5f5; }
        .glass-card { background:rgba(255,255,255,0.1); backdrop-filter:blur(6px); border-radius:1rem; }
        
    /* FX Layer (starfield + grid + blooms) */
    .fx-wrap{ position:fixed; inset:0; z-index:-1; pointer-events:none; }
    .fx-stars{
      position:absolute; inset:0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.18) 0 40%, transparent 50%) 0 0/180px 180px,
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.15) 0 40%, transparent 50%) 0 0/140px 140px,
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.10) 0 40%, transparent 50%) 0 0/220px 220px;
      mix-blend-mode:screen; opacity:.35; filter: blur(.2px);
    }
    .fx-grid{
      position:absolute; inset:-20% -20% -20% -20%;
      background:
        repeating-linear-gradient(to right, rgba(255,255,255,.02) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0 1px, transparent 1px 60px);
      transform:rotate(1deg); opacity:.35; filter: drop-shadow(0 0 20px rgba(255,255,255,.05));
    }
    .fx-bloom{ position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter: blur(60px); opacity:.30; mix-blend-mode:screen; transform: translate(-50%,-50%); }
    .b1{ background:radial-gradient(circle at 40% 40%, rgba(255,59,78,.65), transparent 60%); left:22%; top:28%; }
    .b2{ background:radial-gradient(circle at 60% 60%, rgba(74,163,255,.7), transparent 60%); left:78%; top:34%; }
    .b3{ background:radial-gradient(circle at 50% 50%, rgba(255,209,102,.55), transparent 60%); left:52%; top:78%; }

    /* Card + list polish */
    .glass-card{
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:1rem;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .navbar{ backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom:1px solid rgba(255,255,255,.06); }
    .list-group-item{
      color:#f5f5f5;                       /* <-- force white text */
      background:transparent;
      border-color: rgba(255,255,255,.12);
    }
    .list-group-item:hover{
      background: rgba(255,255,255,.04);
    }
    .lead-muted{ color: rgba(255,255,255,.85); }
    @media (prefers-reduced-motion: reduce){ .fx-grid,.fx-bloom,.fx-stars{ animation:none !important; } }
    /* Background FX (match tiny helper elements we're adding) */
#bg-stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.bg-bloom{ position:fixed; left:-10%; bottom:10%; width:60vw; height:60vw;
  background: radial-gradient(closest-side, rgba(230,57,70,.12), transparent 70%);
  z-index:0; pointer-events:none;
}

/* Keep a single glass style to avoid overrides */
.glass-card{
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1rem;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

    </style>
</head>
<body>
<!-- animated background -->
<canvas id="bg-stars"></canvas>
<div class="bg-bloom"></div>
<nav class="navbar navbar-dark bg-dark bg-opacity-50">
    <div class="container-fluid">
        <span class="navbar-brand">
          <img width="28" height="28" class="me-2" src="{{ url_for('static', path='itc.png') }}" alt="ITC logo" />
          ITC Governance
        </span>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-sm btn-outline-light">Home</a>
            <a href="/tasks" class="btn btn-sm btn-outline-light">Tasks</a>
            <a href="/proposals" class="btn btn-sm btn-outline-light">Proposals</a>
            <a href="/raid" class="btn btn-sm btn-outline-light">Raid</a>
            <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="glass-card p-3 mx-auto" style="max-width:600px;">
        <h1 class="h4">Submit Post URL</h1>
        <form method="post" class="d-flex gap-2 mb-3">
            <input type="url" name="url" class="form-control" placeholder="https://x.com/..." required>
            <button class="btn btn-primary" type="submit">Submit</button>
        </form>
        <h2 class="h5">Your submissions</h2>
        <ul class="list-group list-group-flush">
            {% for u in posts %}
            <li class="list-group-item bg-transparent"><a href="{{ u }}" target="_blank">{{ u }}</a></li>
            {% endfor %}
            {% if not posts %}
            <li class="list-group-item bg-transparent text-muted">No posts submitted</li>
            {% endif %}
        </ul>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || typeof gsap === 'undefined') return;

  // Gentle motion for the bloom
  const bloom = document.querySelector('.bg-bloom');
  if (bloom) {
    gsap.to(bloom, {
      duration: 16,
      xPercent: 3,
      yPercent: -4,
      scale: 1.05,
      opacity: 0.35,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1
    });

    // Tiny parallax
    window.addEventListener('mousemove', e => {
      const dx = (e.clientX - innerWidth / 2) / innerWidth;
      const dy = (e.clientY - innerHeight / 2) / innerHeight;
      gsap.to(bloom, { duration: 0.6, x: dx * 20, y: dy * 20, ease: 'sine.out' });
    }, { passive: true });
  }

  // Simple fade-ins for navbar + card
  const fadeTargets = [document.querySelector('.navbar'), ...document.querySelectorAll('.glass-card')].filter(Boolean);
  fadeTargets.forEach(el => {
    gsap.from(el, { opacity: 0, y: 16, duration: 0.6, ease: 'power2.out' });
  });
})();
</script>
</body>
</html>
