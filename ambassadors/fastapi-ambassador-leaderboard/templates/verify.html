<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='custom.css') }}" rel="stylesheet">
    <style>
        body { min-height:100vh; background:linear-gradient(135deg,#1e1e2f,#141414); color:#f5f5f5; }
        .glass-card { background:rgba(255,255,255,0.1); backdrop-filter:blur(6px); border-radius:1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark bg-opacity-50">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">🏆 Ambassador Leaderboard</a>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-sm btn-outline-light">Home</a>
            <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="glass-card p-3 mx-auto" style="max-width:600px;">
        <h1 class="h4">Submit Post URL</h1>
        <form method="post" class="d-flex gap-2 mb-3">
            <input type="url" name="url" class="form-control" placeholder="https://x.com/..." required>
            <button class="btn btn-primary" type="submit">Submit</button>
        </form>
        <h2 class="h5">Your submissions</h2>
        <ul class="list-group list-group-flush">
            {% for u in posts %}
            <li class="list-group-item bg-transparent"><a href="{{ u }}" target="_blank">{{ u }}</a></li>
            {% endfor %}
            {% if not posts %}
            <li class="list-group-item bg-transparent text-muted">No posts submitted</li>
            {% endif %}
        </ul>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
