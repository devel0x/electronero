<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ambassador Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:linear-gradient(135deg,#1e1e2f,#141414); color:#f5f5f5;">
    <div class="card p-4 bg-dark bg-opacity-75" style="min-width:300px;">
        <h1 class="h4 mb-3 text-center">Login</h1>
        {% if msg %}
        <div class="alert alert-success" role="alert">{{ msg }}</div>
        {% endif %}
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
        <div class="text-center mt-3">
            <a href="/register" class="link-light">Register</a>
        </div>
    </div>
</body>
</html>
