<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambassador Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% 10%, #1f2036 0%, rgba(31,32,54,0) 60%),
                  linear-gradient(135deg, #1e1e2f 0%, #141414 100%);
      color: #f5f5f5;
    }
    .glass-card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .brand-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    a.link-light { opacity: .9; }
    a.link-light:hover { opacity: 1; }
  </style>
</head>
<body class="d-flex align-items-center">
  <div class="container py-5">
    <div class="row g-5 align-items-center justify-content-center">
      <!-- Logo -->
      <div class="col-12 col-md-4 text-center">
        <img class="brand-img img-fluid"
             src="{{ url_for('static', path='itc.png') }}"
             alt="Interchained / ITC logo" />
      </div>

      <!-- Login Card -->
      <div class="col-12 col-md-5 col-lg-4">
        <div class="glass-card p-4">
          <h1 class="h4 mb-3 text-center">ITC Governance</h1>

          {% if msg %}
          <div class="alert alert-success py-2" role="alert">{{ msg }}</div>
          {% endif %}
          {% if error %}
          <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input id="email" type="email" name="email" class="form-control"
                     placeholder="you@example.com" value="{{ email or '' }}"
                     autocomplete="email" required autofocus />
            </div>

            <div class="mb-2 position-relative">
              <label for="password" class="form-label small">Password</label>
              <div class="input-group">
                <input id="password" type="password" name="password" class="form-control"
                       placeholder="Password" autocomplete="current-password" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePwd" aria-label="Show password">Show</button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" name="remember" />
                <label class="form-check-label small" for="remember">Remember me</label>
              </div>
              <a class="small link-light text-decoration-underline" href="/forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </form>

          <div class="text-center mt-3">
            <span class="text-secondary small me-1">No account?</span>
            <a href="/register" class="link-light text-decoration-underline">Register</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const btn = document.getElementById('togglePwd');
      const input = document.getElementById('password');
      btn?.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
