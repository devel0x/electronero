<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambassador Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicon-16x16.png') }}">
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}">
  <meta name="theme-color" content="#0b1220">

  <style>
    :root{ --bg1:#1e1e2f; --bg2:#141414; }
    body{
      min-height:100vh;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      color:#f5f5f5;
      overflow-x:hidden;
    }
    /* FX Layer */
    .fx-wrap{ position:fixed; inset:0; z-index:-1; pointer-events:none; }
    .fx-stars{
      position:absolute; inset:0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.18) 0 40%, transparent 50%) 0 0/180px 180px,
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.15) 0 40%, transparent 50%) 0 0/140px 140px,
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.10) 0 40%, transparent 50%) 0 0/220px 220px;
      mix-blend-mode:screen; opacity:.35; filter: blur(.2px);
    }
    .fx-grid{
      position:absolute; inset:-20% -20% -20% -20%;
      background:
        repeating-linear-gradient(to right, rgba(255,255,255,.02) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0 1px, transparent 1px 60px);
      transform:rotate(1deg); opacity:.35; filter: drop-shadow(0 0 20px rgba(255,255,255,.05));
    }
    .fx-bloom{ position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter: blur(60px); opacity:.30; mix-blend-mode:screen; transform: translate(-50%,-50%); }
    .b1{ background:radial-gradient(circle at 40% 40%, rgba(255,59,78,.65), transparent 60%); left:20%; top:25%; }
    .b2{ background:radial-gradient(circle at 60% 60%, rgba(74,163,255,.7), transparent 60%); left:80%; top:35%; }
    .b3{ background:radial-gradient(circle at 50% 50%, rgba(255,209,102,.55), transparent 60%); left:55%; top:80%; }

    /* Card + logo */
    .glass-card{
      background: rgba(20,20,20,0.85);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .brand-img{
      width: 160px; height: 160px; object-fit: contain; border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    a.link-light { opacity:.9; } a.link-light:hover { opacity:1; }

    @media (prefers-reduced-motion: reduce){
      .fx-grid,.fx-bloom,.fx-stars{ animation:none !important; }
    }
  </style>
</head>
<body class="d-flex align-items-center">

  <!-- FX background -->
  <div class="fx-wrap" aria-hidden="true">
    <div class="fx-stars"></div>
    <div class="fx-grid" id="fxGrid"></div>
    <div class="fx-bloom b1" id="b1"></div>
    <div class="fx-bloom b2" id="b2"></div>
    <div class="fx-bloom b3" id="b3"></div>
  </div>

  <div class="container py-5">
    <div class="row g-5 align-items-center justify-content-center">
      <div class="col-12 col-md-4 text-center">
        <img class="brand-img img-fluid" src="{{ url_for('static', path='itc.png') }}" alt="Interchained / ITC logo" />
      </div>

      <div class="col-12 col-md-5 col-lg-4">
        <div class="glass-card p-4">
          <h1 class="h4 mb-3 text-center">ITC Governance</h1>

          {% if error %}
          <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input id="email" type="email" name="email" class="form-control" placeholder="you@example.com" value="{{ email or '' }}" autocomplete="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label small">Password</label>
              <input id="password" type="password" name="password" class="form-control" placeholder="Password" autocomplete="new-password" minlength="8" required />
            </div>
            <div class="mb-3">
              <label for="telegram" class="form-label small">Telegram Username</label>
              <input id="telegram" type="text" name="telegram" class="form-control" placeholder="@username" value="{{ telegram or '' }}" required>
            </div>
            <div class="mb-3">
              <label for="twitter" class="form-label small">Twitter / X Handle</label>
              <input id="twitter" type="text" name="twitter" class="form-control" placeholder="@handle" value="{{ twitter or '' }}">
            </div>
            <div class="mb-3">
              <label for="discord" class="form-label small">Discord</label>
              <input id="discord" type="text" name="discord" class="form-control" placeholder="username" value="{{ discord or '' }}">
            </div>
            <div class="mb-3">
              <label for="wallet" class="form-label small">Wallet Address</label>
              <input id="wallet" type="text" name="wallet" class="form-control" placeholder="itc1q..." value="{{ wallet or '' }}"
                     pattern="^itc1[ac-hj-np-z02-9]{11,87}$" title="Enter a valid ITC bech32 address (starts with itc1)" required />
              <div class="form-text text-secondary">Paste your ITC (bech32) address — starts with <code>itc1</code>.</div>
            </div>
            <div class="mb-3">
              <label for="referral_code" class="form-label small">Referral Code (optional)</label>
              <input id="referral_code" type="text" name="referral_code" class="form-control" placeholder="Enter referral code" value="{{ referral or '' }}">
              <div class="form-text text-secondary">If someone invited you, paste their code or follow their referral link.</div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" value="1" id="email_opt_in" name="email_opt_in" {% if email_opt_in %}checked{% endif %}>
              <label class="form-check-label small" for="email_opt_in">I agree to receive ambassador program updates by email.</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>

          <div class="text-center mt-3">
            <a href="/login" class="link-light text-decoration-underline">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap + GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || typeof gsap === 'undefined') return;
      const grid = document.getElementById('fxGrid'), b1 = document.getElementById('b1'), b2 = document.getElementById('b2'), b3 = document.getElementById('b3');
      gsap.to(b1, { duration:10, xPercent:-5, yPercent:6,  scale:1.07, opacity:.35, ease:'sine.inOut', yoyo:true, repeat:-1 });
      gsap.to(b2, { duration:12, xPercent: 4, yPercent:-4, scale:1.06, opacity:.33, ease:'sine.inOut', yoyo:true, repeat:-1, delay:.3 });
      gsap.to(b3, { duration:14, xPercent:-2, yPercent:3,  scale:1.08, opacity:.32, ease:'sine.inOut', yoyo:true, repeat:-1, delay:.6 });
      gsap.to(grid,{ duration:20, rotation:3, ease:'sine.inOut', yoyo:true, repeat:-1 });
      // Tiny parallax
      window.addEventListener('mousemove', e => {
        const dx=(e.clientX-innerWidth/2)/innerWidth, dy=(e.clientY-innerHeight/2)/innerHeight;
        gsap.to([b1,b2,b3], { duration:.6, x:dx*30, y:dy*30, ease:'sine.out' });
        gsap.to(grid, { duration:.8, x:dx*20, y:dy*20, ease:'sine.out' });
      }, { passive:true });
    })();
  </script>
</body>
</html>
