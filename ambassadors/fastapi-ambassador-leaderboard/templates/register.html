<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambassador Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicon-16x16.png') }}">
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}">
    <meta name="theme-color" content="#0b1220">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% 10%, #1f2036 0%, rgba(31,32,54,0) 60%),
                  linear-gradient(135deg, #1e1e2f 0%, #141414 100%);
      color: #f5f5f5;
    }
    .glass-card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .brand-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    a.link-light { opacity: .9; }
    a.link-light:hover { opacity: 1; }
  </style>
</head>
<body class="d-flex align-items-center">
  <div class="container py-5">
    <div class="row g-5 align-items-center justify-content-center">
      <!-- Logo (left on desktop, stacked on mobile) -->
      <div class="col-12 col-md-4 text-center">
        <img class="brand-img img-fluid"
             src="{{ url_for('static', path='itc.png') }}"
             alt="Interchained / ITC logo" />
      </div>

      <!-- Form Card -->
      <div class="col-12 col-md-5 col-lg-4">
        <div class="glass-card p-4">
          <h1 class="h4 mb-3 text-center">ITC Governance</h1>

          {% if error %}
          <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input id="email" type="email" name="email" class="form-control" placeholder="you@example.com"
                     value="{{ email or '' }}" autocomplete="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label small">Password</label>
              <input id="password" type="password" name="password" class="form-control" placeholder="Password"
                     autocomplete="new-password" minlength="8" required />
            </div>
            <div class="mb-3">
              <label for="wallet" class="form-label small">Wallet Address</label>
              <input id="wallet" type="text" name="wallet" class="form-control" placeholder="itc1q..."
                     value="{{ wallet or '' }}"
                     pattern="^itc1[ac-hj-np-z02-9]{11,87}$"
                     title="Enter a valid ITC bech32 address (starts with itc1)"
                     required />
              <div class="form-text text-secondary">Paste your ITC (bech32) address — starts with <code>itc1</code>.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>

          <div class="text-center mt-3">
            <a href="/login" class="link-light text-decoration-underline">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
