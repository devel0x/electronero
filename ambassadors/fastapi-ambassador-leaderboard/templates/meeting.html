<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambassador Meeting Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', path='custom.css') }}" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #101321, #06070d);
      color: #f1f5f9;
    }
    .meeting-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(10, 18, 35, 0.4);
    }
    .video-wall {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .video-tile {
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .video-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111827;
    }
    .video-label {
      position: absolute;
      bottom: 0.5rem;
      left: 0.5rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .chat-panel {
      max-height: 65vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.78);
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem;
    }
    .chat-bubble {
      padding: 0.6rem 0.75rem;
      border-radius: 0.75rem;
      margin-bottom: 0.75rem;
      background: rgba(148, 163, 184, 0.15);
      font-size: 0.9rem;
    }
    .chat-bubble.me {
      background: linear-gradient(135deg, rgba(74, 163, 255, 0.85), rgba(255, 59, 78, 0.85));
      color: #0b1120;
      font-weight: 600;
      margin-left: auto;
    }
    .chat-meta {
      display: block;
      font-size: 0.7rem;
      opacity: 0.7;
    }
    .controls button {
      min-width: 140px;
    }
    .participants {
      background: rgba(15, 23, 42, 0.75);
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem;
      max-height: 18rem;
      overflow-y: auto;
    }
    .status-banner {
      background: rgba(14, 165, 233, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
    }
    @media (max-width: 991.98px) {
      .chat-panel {
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark bg-opacity-50">
    <div class="container-fluid">
      <span class="navbar-brand">
        <img width="28" height="28" class="me-2" src="{{ url_for('static', path='itc.png') }}" alt="ITC logo" />
        ITC Governance
      </span>
      <div class="d-flex flex-wrap gap-2 align-items-center nav-actions">
        <a href="/" class="btn btn-sm btn-outline-light">Leaderboard</a>
        <a href="/wallet" class="btn btn-sm btn-outline-light">Wallet</a>
        <a href="/gamefi" class="btn btn-sm btn-outline-light">GameFi</a>
        <a href="/staking" class="btn btn-sm btn-outline-light">Staking</a>
        <a href="/transfers" class="btn btn-sm btn-outline-light">Transfers</a>
        <a href="/otc" class="btn btn-sm btn-outline-light">OTC Desk</a>
        <a href="/p2p" class="btn btn-sm btn-outline-light">P2P Shop</a>
        <a href="/referrals" class="btn btn-sm btn-outline-light">Referrals</a>
        <a href="/tasks" class="btn btn-sm btn-outline-light">Tasks</a>
        <a href="/verify" class="btn btn-sm btn-outline-light">Verify</a>
        <a href="/proposals" class="btn btn-sm btn-outline-light">Proposals</a>
        <a href="/raid" class="btn btn-sm btn-outline-light">Raid</a>
        <a href="/business/meetings" class="btn btn-sm btn-light text-dark fw-semibold">Meetings</a>
        <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4 align-items-stretch">
      <div class="col-lg-8 d-flex flex-column gap-3">
        <div class="status-banner" id="statusBanner">
          Connected as <strong>{{ display_name }}</strong> · Room: <strong>{{ room_label }}</strong>
        </div>
        <div class="meeting-card p-3 flex-grow-1 d-flex flex-column">
          <div class="d-flex flex-column flex-sm-row gap-2 justify-content-between align-items-sm-center mb-3 controls">
            <div class="btn-group" role="group" aria-label="Media controls">
              <button type="button" class="btn btn-outline-light" id="toggleAudioBtn">
                <span class="me-1">🔊</span>Toggle Audio
              </button>
              <button type="button" class="btn btn-outline-light" id="toggleVideoBtn">
                <span class="me-1">🎥</span>Toggle Video
              </button>
              <button type="button" class="btn btn-outline-light" id="shareScreenBtn">
                <span class="me-1">🖥️</span>Share Screen
              </button>
            </div>
            <button type="button" class="btn btn-outline-info" id="refreshConnectionsBtn">
              <span class="me-1">🔄</span>Reconnect Peers
            </button>
          </div>
          <div class="video-wall flex-grow-1" id="videoWall">
            <div class="video-tile" id="localTile">
              <video id="localVideo" autoplay muted playsinline></video>
              <span class="video-label">You · {{ display_name }}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4 d-flex flex-column gap-3">
        <div class="meeting-card p-3">
          <h2 class="h6 text-uppercase text-info mb-3">Participants</h2>
          <ul class="list-unstyled mb-0" id="participantList">
            <li class="d-flex align-items-center gap-2 mb-2" data-peer-id="self">
              <span class="badge bg-success">●</span>
              <span>{{ display_name }} (You)</span>
            </li>
          </ul>
        </div>
        <div class="meeting-card p-3 flex-grow-1 d-flex flex-column">
          <h2 class="h6 text-uppercase text-info mb-3">Live Chat</h2>
          <div class="chat-panel flex-grow-1" id="chatMessages" aria-live="polite"></div>
          <form id="chatForm" class="mt-3">
            <div class="input-group">
              <input type="text" class="form-control" id="chatInput" autocomplete="off" placeholder="Share updates with your squad" />
              <button class="btn btn-primary" type="submit">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.MEETING_CONFIG = {
      roomId: {{ room_id|tojson }},
      displayName: {{ display_name|tojson }}
    };
  </script>
  <script src="{{ url_for('static', path='meeting.js') }}" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
