<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#1e1e2f,#141414);color:#f5f5f5;}
    .glass-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);border-radius:1rem;}
  </style>
</head>
<body class="d-flex align-items-center">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="glass-card p-4">
          <h1 class="h5 mb-3 text-center">Forgot Password</h1>
          {% if msg %}<div class="alert alert-success py-2" role="alert">{{ msg }}</div>{% endif %}
          <form method="post">
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input id="email" type="email" name="email" class="form-control" required autofocus />
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
          <div class="text-center mt-3">
            <a href="/login" class="link-light text-decoration-underline small">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
