<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recover Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicon-16x16.png') }}">
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}">
  <meta name="theme-color" content="#0b1220">
  <style>
    :root{ --bg1:#0b1220; --bg2:#06080f; --red:#e63946; }
    body{ min-height:100vh; background:radial-gradient(1200px 600px at 20% 10%, rgba(230,57,70,.12), transparent 60%), linear-gradient(135deg,var(--bg1),var(--bg2)); color:#f5f5f5; overflow-x:hidden; position:relative; }
    .glass-card{ background: rgba(20,20,28,0.82); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .brand-img{ width:160px; height:160px; object-fit:contain; border-radius:9999px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
    .btn-primary{ background: linear-gradient(90deg, var(--red), #ff6b6b); border: none; box-shadow: 0 6px 18px rgba(230,57,70,.35); }
    .btn-primary:hover{ filter: brightness(1.05); }
    a.link-light{ opacity:.9; } a.link-light:hover{ opacity:1; }
    
    /* FX Layer (starfield + grid + blooms) */
    .fx-wrap{ position:fixed; inset:0; z-index:-1; pointer-events:none; }
    .fx-stars{
      position:absolute; inset:0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.18) 0 40%, transparent 50%) 0 0/180px 180px,
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.15) 0 40%, transparent 50%) 0 0/140px 140px,
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.10) 0 40%, transparent 50%) 0 0/220px 220px;
      mix-blend-mode:screen; opacity:.35; filter: blur(.2px);
    }
    .fx-grid{
      position:absolute; inset:-20% -20% -20% -20%;
      background:
        repeating-linear-gradient(to right, rgba(255,255,255,.02) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0 1px, transparent 1px 60px);
      transform:rotate(1deg); opacity:.35; filter: drop-shadow(0 0 20px rgba(255,255,255,.05));
    }
    .fx-bloom{ position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter: blur(60px); opacity:.30; mix-blend-mode:screen; transform: translate(-50%,-50%); }
    .b1{ background:radial-gradient(circle at 40% 40%, rgba(255,59,78,.65), transparent 60%); left:22%; top:28%; }
    .b2{ background:radial-gradient(circle at 60% 60%, rgba(74,163,255,.7), transparent 60%); left:78%; top:34%; }
    .b3{ background:radial-gradient(circle at 50% 50%, rgba(255,209,102,.55), transparent 60%); left:52%; top:78%; }

    /* Card + list polish */
    .glass-card{
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:1rem;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .navbar{ backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom:1px solid rgba(255,255,255,.06); }
    .list-group-item{
      color:#f5f5f5;                       /* <-- force white text */
      background:transparent;
      border-color: rgba(255,255,255,.12);
    }
    .list-group-item:hover{
      background: rgba(255,255,255,.04);
    }
    .lead-muted{ color: rgba(255,255,255,.85); }
    @media (prefers-reduced-motion: reduce){ .fx-grid,.fx-bloom,.fx-stars{ animation:none !important; } }
    /* Background FX (match existing elements you render) */
#bg-stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.bg-bloom{ position:fixed; left:-10%; bottom:10%; width:60vw; height:60vw;
  background: radial-gradient(closest-side, rgba(230,57,70,.12), transparent 70%); z-index:0; pointer-events:none; }

/* If you have two .glass-card blocks, keep just one. 
   This is the recommended (polished) version: */
.glass-card{
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1rem;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

  </style>
</head>
<body class="d-flex align-items-center">
  <!-- animated background -->
  <canvas id="bg-stars"></canvas>
  <div class="bg-bloom"></div>

  <div class="container py-5 content">
    <div class="row g-5 align-items-center justify-content-center">
      <div class="col-12 col-md-4 text-center" data-animate="fade-up">
        <img class="brand-img img-fluid" data-floaty src="{{ url_for('static', path='itc.png') }}" alt="Interchained / ITC logo" />
      </div>

      <div class="col-12 col-md-5 col-lg-4" data-animate="fade-up">
        <div class="glass-card p-4">
          <h1 class="h4 mb-3 text-center">Recover IGP Account</h1>

          <form method="post" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label small">Email</label>
              <input id="email" type="email" name="email" class="form-control" placeholder="you@example.com" value="{{ email or '' }}" autocomplete="email" required autofocus />
            </div>
            <button type="submit" class="btn btn-primary w-100">Recover</button>
          </form>

          <div class="text-center mt-3">
            <a class="link-light text-decoration-none" href="/login">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Help Modal -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header text-dark">
          <h5 class="modal-title text-dark">Need help?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-dark">
          Please contact <a class="text-dark" href="https://t.me/interchained" target="_blank">@interchained</a> on TG.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% if submitted %}
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var modal = new bootstrap.Modal(document.getElementById('contactModal'));
      modal.show();
    });
  </script>
  {% endif %}

  <!-- GSAP + animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || typeof gsap === 'undefined') return;

  // Gentle motion for the existing .bg-bloom element
  const bloom = document.querySelector('.bg-bloom');
  if (bloom) {
    gsap.to(bloom, {
      duration: 16,
      xPercent: 3,
      yPercent: -4,
      scale: 1.05,
      opacity: 0.35,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1
    });

    // Tiny parallax
    window.addEventListener('mousemove', e => {
      const dx = (e.clientX - innerWidth / 2) / innerWidth;
      const dy = (e.clientY - innerHeight / 2) / innerHeight;
      gsap.to(bloom, { duration: 0.6, x: dx * 20, y: dy * 20, ease: 'sine.out' });
    }, { passive: true });
  }

  // Fade-ins for elements that already have data-animate
  if (typeof ScrollTrigger !== 'undefined') {
    gsap.utils.toArray('[data-animate]').forEach(el => {
      const type = el.getAttribute('data-animate');
      const from = (type === 'fade-up') ? { y: 20, opacity: 0 } : { opacity: 0 };
      gsap.from(el, {
        ...from,
        duration: 0.6,
        ease: 'power2.out',
        scrollTrigger: { trigger: el, start: 'top 85%' }
      });
    });
  }
})();
</script>
</body>
</html>
