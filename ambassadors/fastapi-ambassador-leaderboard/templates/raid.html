<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{{ url_for('static', path='custom.css') }}" rel="stylesheet" />
    <style>
        body { min-height:100vh; background:linear-gradient(135deg,#1e1e2f,#141414); color:#f5f5f5; }
        .glass-card { background:rgba(255,255,255,0.1); backdrop-filter:blur(6px); border-radius:1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark bg-opacity-50">
    <div class="container-fluid">
        <span class="navbar-brand">
          <img width="28" height="28" class="me-2" src="{{ url_for('static', path='itc.png') }}" alt="ITC logo" />
          ITC Governance
        </span>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-sm btn-outline-light">Home</a>
            <a href="/tasks" class="btn btn-sm btn-outline-light">Tasks</a>
            <a href="/verify" class="btn btn-sm btn-outline-light">Verify</a>
            <a href="/proposals" class="btn btn-sm btn-outline-light">Proposals</a>
            <a href="/raid" class="btn btn-sm btn-outline-light">Raid</a>
            <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="glass-card p-3">
        <h1 class="h4">Verified Posts</h1>
        <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
                <thead>
                    <tr>
                        <th>Post</th>
                        <th>Telegram</th>
                        <th>Wallet</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in entries %}
                    <tr>
                        <td><a href="{{ e.url }}" target="_blank">{{ e.url }}</a></td>
                        <td>{{ e.telegram or '—' }}</td>
                        <td class="small">{{ e.wallet or '—' }}</td>
                    </tr>
                    {% endfor %}
                    {% if not entries %}
                    <tr><td colspan="3" class="text-muted">No verified posts</td></tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
