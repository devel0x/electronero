<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <div class="container" style="max-width:400px;">
    <h1 class="h4 mb-3 text-center">Edit Wallet</h1>
    {% if error %}
    <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label for="wallet" class="form-label small">Wallet Address</label>
        <input id="wallet" type="text" name="wallet" class="form-control" placeholder="itc1q..." value="{{ wallet or '' }}" pattern="^itc1[ac-hj-np-z02-9]{11,87}$" title="Enter a valid ITC bech32 address (starts with itc1)" required />
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-grow-1">Save</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
