<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Referral Link</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container py-5">
  <h1 class="h4 mb-4">Referral Link</h1>
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  {% if code %}
  <p>Your referral link:</p>
  <div class="mb-3">
    <input class="form-control" type="text" readonly value="{{ link }}" />
  </div>
  <p>Clicks: {{ clicks }} &nbsp; Registrations: {{ registrations }}</p>
  {% else %}
  <form method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Choose a username</label>
      <input id="username" name="username" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Generate</button>
  </form>
  {% endif %}
  <div class="mt-3"><a href="/">Back to leaderboard</a></div>
</body>
</html>
