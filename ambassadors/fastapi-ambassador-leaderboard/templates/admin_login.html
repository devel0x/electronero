<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='custom.css') }}" rel="stylesheet">
    <style>
        body { min-height:100vh; background:linear-gradient(135deg,#1e1e2f,#141414); color:#f5f5f5; }
        .glass-card { background:rgba(255,255,255,0.1); backdrop-filter:blur(6px); border-radius:1rem; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="glass-card p-4 mx-auto" style="max-width:400px;">
        <h1 class="h4 mb-3 text-center">Admin Login</h1>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
