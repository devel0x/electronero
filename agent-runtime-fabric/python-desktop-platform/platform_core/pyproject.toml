[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydesk"
version = "0.1.0"
description = "Python-first desktop platform scaffold"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pywebview>=5.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
pydesk = "pydesk.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
