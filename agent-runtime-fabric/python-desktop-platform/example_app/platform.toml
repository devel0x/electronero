[app]
name = "sample-workbench"
id = "com.pydesk.sampleworkbench"
version = "0.2.0"

[desktop]
width = 1200
height = 800

[permissions]
filesystem = ["./data"]
clipboard = true
notifications = true
subprocess = false

[runtime]
plugins_enabled = true

[build]
tool = "pyinstaller"
entrypoint = "desktop/main.py"
